services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────
  - type: web
    name: buildtogether-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./together.db
      - key: ALLOWED_ORIGINS
        fromService:
          type: static_site
          name: buildtogether-frontend
          property: url
      # Instructions to user: Set FIREBASE_CREDENTIALS in Render dashboard as a JSON string

  # ── Frontend Static Site (React/Vite) ──────────────────────────────
  - type: static_site
    name: buildtogether-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: buildtogether-backend
          property: url
